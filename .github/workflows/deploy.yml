name: Deploy
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check Tag Matches Version
        if: github.ref_type == 'tag'
        run: |
          version="$(sed -n "s/^version = '\(.*\)'$/\1/p" build.gradle)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in build.gradle" >&2
            exit 1
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'

      - name: Publish with Gradle
        env:
          ORG_GRADLE_PROJECT_CleanroomRepo: ${{ vars.CLEANROOM_MAVEN }}
          ORG_GRADLE_PROJECT_CleanroomUsername: ${{ secrets.MAVEN_USER }}
          ORG_GRADLE_PROJECT_CleanroomPassword: ${{ secrets.MAVEN_TOKEN }}
        run: ./gradlew --build-cache --info --stacktrace publish
